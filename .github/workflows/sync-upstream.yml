name: Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream changes
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/metowolf/vCards.git
          git fetch upstream master
          if git diff --quiet HEAD upstream/master; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/master
          git push origin HEAD:master
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Build a new release
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master
